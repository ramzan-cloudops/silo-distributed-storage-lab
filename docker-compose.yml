services:
  silo1:
    image: ${SILO_IMAGE}
    restart: unless-stopped
    command:
      - server
      - "http://silo{1...4}/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/silo1:/data
    networks:
      - silo_network
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

