services:
  silo1:
    image: ${SILO_IMAGE}
    restart: unless-stopped
    command:
      - server
      - "http://silo{1...4}/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SILO_METRICS_LISTEN: ${SILO_METRICS_LISTEN}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE}
    volumes:
      - ./data/silo1:/data
    networks:
      - silo_network
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  silo2:
    image: ${SILO_IMAGE}
    restart: unless-stopped
    command:
      - server
      - "http://silo{1...4}/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SILO_METRICS_LISTEN: ${SILO_METRICS_LISTEN}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE}
    volumes:
      - ./data/silo2:/data
    networks:
      - silo_network
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  silo3:
    image: ${SILO_IMAGE}
    restart: unless-stopped
    command:
      - server
      - "http://silo{1...4}/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SILO_METRICS_LISTEN: ${SILO_METRICS_LISTEN}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE}
    volumes:
      - ./data/silo3:/data
    networks:
      - silo_network
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  silo4:
    image: ${SILO_IMAGE}
    restart: unless-stopped
    command:
      - server
      - "http://silo{1...4}/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SILO_METRICS_LISTEN: ${SILO_METRICS_LISTEN}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE}
    volumes:
      - ./data/silo4:/data
    networks:
      - silo_network
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SILO_API_PORT}:9000"
      - "127.0.0.1:${SILO_CONSOLE_PORT}:9001"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - silo1
      - silo2
      - silo3
      - silo4
    networks:
      - silo_network

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: silo-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - silo1
      - silo2
      - silo3
      - silo4
    networks:
      - silo_network
networks:
  silo_network:
    driver: bridge
